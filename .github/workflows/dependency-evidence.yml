name: Dependency security evidence
on:
  push:
    branches: [feat/dependency-security]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --json > audit.json || test -s audit.json
      - run: node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.metadata)); console.log(JSON.stringify(a.vulnerabilities))'
